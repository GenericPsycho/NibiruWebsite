current: kali
booted_at: '2026-08-20T10:00:00Z'
host:
  name: devbox
  cpu: AMD Ryzen 7 7700
  gpu: AMD Radeon RX 7700 XT
  memory: 32 GB DDR5
  resolution: 2560x1440
about:
  command: lazygit --view bio
  status:
    branch: main
    since: 2026
    ahead: 1
    behind: 0
    modified: 2
    untracked: 0
  bio:
    - icon: ">"
      text: I make programs to entertain people, whether minigames, horror blogs,
    - icon: 
      text: or interactive Arcana readers, my code plans to give people some fun.
    - icon: ">"
      text: I've been working with code for around 5 years, mostly as high-school
    - icon: 
      text: 'projects, later on I partnered with <a href="https://beyondstars.dev" target="_blank" rel="noopener">stargazer</a> to create a horror'
    - icon: 
      text: 'blog called <a href="https://analogium.xyz" target="_blank" rel="noopener">ANALOGIUM</a>.'
  paths:
    - name: main
      current: true
    - name: feature/themes
    - name: feature/seo
    - name: feature/sync-script
    - name: feature/yaml-config
    - name: fix/components
    - name: docs/readme
uses:
  command: btop --view stack — daily usage && hardware
  cpu:
    label: CPU [daily usage]
    usage:
      - label: editor
        percent: 100
        detail: zed / vscode
      - label: terminal
        percent: 60
        detail: alacritty + tmux
      - label: browser
        percent: 20
        detail: firefox / brave
      - label: notes
        percent: 10
        detail: obsidian
        note: (markdown sync)
      - label: music
        percent: 10
        detail: navidrome
        note: (lastfm scrobbling)
      - label: theme
        percent: 50
        detail: tokyo night
      - label: font
        percent: 40
        detail: JetBrains Mono
  memory:
    used: 16
    total: 32
    theme: tokyo night
    themePercent: 50
  hardware:
    label: hardware
    device: devbox
    ram: 32 GB DDR5
    os: Debian 13 Trixie
  peripherals:
    label: peripherals
    keyboard: Keychron K6
    mouse: Logitech G Pro
    headphones: generic
    monitor: 2 x 27" 1440p
